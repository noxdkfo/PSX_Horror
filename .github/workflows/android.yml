
name: Night Bus Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Compilar com Unity
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: NightBus

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: NightBus-Android
          path: build/
          if-no-files-found: warn
